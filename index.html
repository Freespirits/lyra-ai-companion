<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,560;1,9..144,340&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#08060e; --glass:rgba(17,12,30,.58); --glass2:rgba(24,17,42,.72);
    --line:rgba(190,170,255,.15); --text:#f2edff; --dim:#9d92c4;
    --listen:#7de3d8; --think:#ffd166; --speak:#ff6b9d; --accent:#a78bfa;
    --bar-h:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Heebo","Segoe UI",system-ui,sans-serif;
    background:var(--void); color:var(--text);
  }
  button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
  button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- stage ---------- */
  #stageInner{position:fixed;inset:0}
  #cv3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* the breathing halo: the interface's voice. Its color IS the state. */
  #halo{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;
    transition:opacity 1.2s ease, box-shadow 1.2s ease}
  body[data-s="listening"] #halo{opacity:1;box-shadow:inset 0 0 170px -40px var(--listen);animation:breathe 3.6s ease-in-out infinite}
  body[data-s="thinking"]  #halo{opacity:1;box-shadow:inset 0 0 170px -40px var(--think);animation:breathe 2.2s ease-in-out infinite}
  body[data-s="speaking"]  #halo{opacity:1;box-shadow:inset 0 0 190px -30px var(--speak);animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{filter:brightness(.75)}50%{filter:brightness(1.25)}}
  @media (prefers-reduced-motion: reduce){
    #halo{animation:none !important}
    body[data-s] #halo{animation:none !important}
  }

  #fx{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  #fx span{position:absolute;animation:floatUp 2s ease-out forwards}
  #fx .hearts{color:var(--speak);text-shadow:0 0 10px rgba(255,107,157,.6)}
  #fx .sparkle{color:var(--think);text-shadow:0 0 10px rgba(255,209,102,.6)}
  @keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-130px) scale(1.15) rotate(14deg)}}

  /* ---------- identity / status ---------- */
  #ident{position:fixed;top:18px;left:22px;z-index:5;display:flex;align-items:baseline;gap:12px}
  #ident h1{font-family:"Fraunces",serif;font-weight:560;font-size:26px;letter-spacing:.02em}
  #status{font-size:12px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
  #status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim);transition:background .4s, box-shadow .4s}
  body[data-s="listening"] #status::before{background:var(--listen);box-shadow:0 0 8px var(--listen)}
  body[data-s="thinking"]  #status::before{background:var(--think); box-shadow:0 0 8px var(--think)}
  body[data-s="speaking"]  #status::before{background:var(--speak); box-shadow:0 0 8px var(--speak)}
  body.incall #status::before{background:var(--listen)}
  #hearts{position:fixed;top:20px;right:22px;z-index:5;font-size:15px;letter-spacing:3px;color:var(--speak);text-shadow:0 0 12px rgba(255,107,157,.5)}
  #hearts .off{color:#3d3260;text-shadow:none}

  /* ---------- captions ---------- */
  /* floating composer on the main stage */
  #composer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h) + 30px);z-index:6;
    width:min(600px,86vw);display:flex;flex-direction:column;gap:6px}
  #composer #inpRow{display:flex;gap:8px;padding:6px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 32px rgba(0,0,0,.4)}
  #composer #inp{flex:1;background:none;border:none;color:var(--text);padding:8px 10px;font-size:14px;outline:none;min-width:0}
  #composer #inp::placeholder{color:var(--dim);opacity:.7}
  #composer #attBtn{width:38px;height:38px;border-radius:50%;font-size:20px;color:var(--dim);flex:none}
  #composer #attBtn:hover{color:var(--text);background:rgba(190,170,255,.08)}
  #composer #sendBtn{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#6d4fe0,#8b5cf6);color:#fff}
  #composer #sendBtn:hover{filter:brightness(1.12)}
  #attRow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  #attRow .chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);
    background:var(--glass);backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;max-width:180px}
  #attRow .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #attRow .chip img{width:20px;height:20px;border-radius:50%;object-fit:cover}
  #attRow .chip button{color:var(--dim);font-size:14px;line-height:1;padding:0 4px}
  #attRow .chip button:hover{color:var(--speak)}

  #caps{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h) + 94px);z-index:5;
    width:min(720px,86vw);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
  #capUser{font-size:14px;color:var(--dim);font-weight:300;font-style:italic;text-align:center;min-height:0;
    opacity:0;transition:opacity .3s}
  #capUser.show{opacity:.9}
  #capLyra{font-size:clamp(16px,2.1vw,21px);line-height:1.65;font-weight:400;text-align:center;
    text-shadow:0 1px 12px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9)}
  #capLyra span{opacity:.28;transition:opacity .18s ease}
  #capLyra span.said{opacity:1}
  #capLyra.plain span{opacity:1}

  /* ---------- call bar ---------- */
  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:6;
    display:flex;align-items:center;gap:10px;height:var(--bar-h);padding:0 14px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 40px rgba(0,0,0,.45)}
  .rbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--dim);transition:color .2s, background .2s, transform .15s;position:relative}
  .rbtn:hover{color:var(--text);background:rgba(190,170,255,.08)}
  .rbtn:active{transform:scale(.92)}
  .rbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .rbtn.on{color:var(--listen)}
  #callBtn{width:54px;height:54px;background:linear-gradient(135deg,#6d4fe0,#8b5cf6);color:#fff;box-shadow:0 4px 22px rgba(139,92,246,.45)}
  #callBtn:hover{color:#fff;filter:brightness(1.12)}
  #callBtn.on{background:linear-gradient(135deg,#e0455e,#ff6b9d);box-shadow:0 4px 22px rgba(255,107,157,.5)}
  #muteBtn.on{color:var(--speak)}
  #stopBtn{display:none}
  body[data-s="speaking"] #stopBtn, body[data-s="thinking"] #stopBtn{display:flex}
  #timer{font-size:12px;color:var(--dim);min-width:44px;text-align:center;font-variant-numeric:tabular-nums;display:none}
  body.incall #timer{display:block}

  /* ---------- self view (your camera) ---------- */
  #selfWrap{position:fixed;right:18px;bottom:calc(var(--bar-h) + 30px);z-index:5;
    width:190px;display:none;transition:width .25s ease, opacity .3s}
  #selfWrap.show{display:block}
  #selfWrap.mini{width:84px;opacity:.75}
  #selfWrap:hover{opacity:1}
  #selfView{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block;
    border:1px solid var(--line);background:#0a0812;
    transform:scaleX(-1);box-shadow:0 8px 32px rgba(0,0,0,.5);cursor:pointer}
  #selfWrap.rear #selfView{transform:none}   /* rear camera: no mirror */
  #flipCam{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;
    display:none;align-items:center;justify-content:center;color:#fff;
    background:rgba(10,8,18,.65);border:1px solid var(--line);backdrop-filter:blur(8px)}
  #selfWrap.multi #flipCam{display:flex}
  #selfWrap.mini #flipCam{display:none}
  #flipCam:hover{background:rgba(139,92,246,.5)}
  @media (max-width:640px){#selfWrap{width:120px;right:10px}}

  /* ---------- pickers ---------- */
  .picker{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(var(--bar-h) + 30px);z-index:7;
    display:none;flex-wrap:wrap;justify-content:center;gap:8px;max-width:min(640px,90vw);padding:12px;border-radius:18px;
    background:var(--glass2);border:1px solid var(--line);backdrop-filter:blur(18px);
    opacity:0;transition:opacity .22s, transform .22s}
  .picker.open{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
  .picker button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--dim);
    transition:color .2s, border-color .2s, background .2s;text-transform:capitalize}
  .picker button:hover{color:var(--text);border-color:var(--accent)}
  .picker button.cur{color:var(--text);background:rgba(167,139,250,.16);border-color:var(--accent)}
  .charThumb{width:30px;height:30px;border-radius:50%;background:rgba(167,139,250,.25);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text);
    background-size:cover;background-position:center;text-transform:uppercase}
  .charPicker button{flex-direction:column;align-items:center;gap:4px;width:118px;padding:12px 10px;text-align:center}
  .charPicker .cName{font-size:14px;color:var(--text)}
  .charPicker .cTags{font-size:10px;color:var(--dim);line-height:1.3}
  .charPicker .cTag{font-size:10px;color:var(--dim);text-transform:capitalize}
  .charPicker .cLine{font-size:10px;color:var(--accent);opacity:.85}
  .charPicker button .charThumb{width:52px;height:52px;font-size:20px}

  /* ---------- chat drawer ---------- */
  #drawer{position:fixed;top:0;right:0;bottom:0;z-index:8;width:min(400px,94vw);
    background:var(--glass2);border-left:1px solid var(--line);backdrop-filter:blur(22px);
    display:flex;flex-direction:column;transform:translateX(102%);transition:transform .32s cubic-bezier(.3,.9,.3,1)}
  #drawer.open{transform:none}
  #drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  #drawer header b{font-family:"Fraunces",serif;font-weight:560;font-size:17px}
  #drawer header button{color:var(--dim);font-size:20px;line-height:1;padding:4px 8px}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:#33285c;border:1px solid rgba(167,139,250,.35);border-bottom-right-radius:4px}
  .msg.lyra{align-self:flex-start;background:rgba(42,33,68,.85);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.sys{align-self:center;border:1px dashed rgba(255,107,157,.4);color:var(--dim);font-size:12px}
  #drawer details{border-top:1px solid var(--line);padding:10px 16px 14px;font-size:12px;color:var(--dim)}
  #drawer summary{cursor:pointer;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;padding:4px 0}
  .dbgRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .dbgRow button{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .dbgRow button:hover{color:var(--text);border-color:var(--accent)}
  .dbgRow label{display:flex;align-items:center;gap:5px}
  select{background:rgba(10,7,20,.6);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:12px}

  /* ---------- loading / toast ---------- */
  #loading{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;background:var(--void);color:var(--dim);font-size:13px;text-align:center;padding:20px}
  #loading .name{font-family:"Fraunces",serif;font-size:44px;font-weight:340;color:var(--text);
    animation:namebreathe 2.6s ease-in-out infinite}
  @keyframes namebreathe{0%,100%{opacity:.45}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){#loading .name{animation:none}}
  #toast{position:fixed;bottom:calc(var(--bar-h) + 34px);left:50%;transform:translateX(-50%);z-index:15;
    background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;
    opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(12px)}
  #toast.show{opacity:1}

  @media (max-width:640px){
    #ident h1{font-size:21px}
    #caps{bottom:calc(var(--bar-h) + 34px)}
    #bar{gap:5px;padding:0 10px}
    .rbtn{width:40px;height:40px}
  }
</style>
</head>
<body data-s="idle">
  <div id="stageInner"><canvas id="cv3d"></canvas></div>
  <div id="halo"></div>
  <div id="fx"></div>

  <div id="ident">
    <h1>Lyra</h1>
    <div id="status">offline</div>
  </div>
  <div id="hearts"></div>

  <div id="caps">
    <div id="capUser" dir="auto"></div>
    <div id="capLyra" dir="auto"></div>
  </div>

  <div id="scenePicker" class="picker"></div>
  <div id="charPicker" class="picker charPicker"></div>

  <div id="selfWrap">
    <video id="selfView" muted playsinline title="You (click to shrink)"></video>
    <button id="flipCam" title="Switch camera">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8v4h4M21 16v-4h-4M6.5 12a6 6 0 0 1 10.2-3.5M17.5 12a6 6 0 0 1-10.2 3.5"/></svg>
    </button>
  </div>

  <div id="composer">
    <div id="attRow"></div>
    <div id="inpRow">
      <button id="attBtn" title="Attach files (images, video, txt, pdf)">+</button>
      <input id="attFile" type="file" multiple accept="image/*,video/*,.txt,.md,.pdf" hidden>
      <input id="inp" placeholder="Type to her..." autocomplete="off" dir="auto">
      <button id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <div id="bar">
    <span id="timer">0:00</span>
    <button id="callBtn" class="rbtn" title="Start call">
      <svg viewBox="0 0 24 24"><path d="M5 4h3l2 5-2.5 1.5a12 12 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
    </button>
    <button id="muteBtn" class="rbtn" title="Mute mic">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button id="stopBtn" class="rbtn" title="Interrupt her">
      <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
    </button>
    <button id="sceneBtn" class="rbtn" title="Change scene">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="15" cy="9" r="1.4"/></svg>
    </button>
    <button id="charBtn" class="rbtn" title="Choose your companion">
      <span id="charBtnImg" class="charThumb"></span>
    </button>
    <button id="visionBtn" class="rbtn" title="Let her see you (camera)">
      <svg viewBox="0 0 24 24"><path d="M2 8.5A2.5 2.5 0 0 1 4.5 6h9A2.5 2.5 0 0 1 16 8.5v7a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 2 15.5zM16 10l5-3v10l-5-3"/></svg>
    </button>
    <button id="camBtn" class="rbtn" title="Close up / full body">
      <svg viewBox="0 0 24 24"><path d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3"/></svg>
    </button>
    <button id="chatBtn" class="rbtn" title="Chat history">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2.4-2.9A8 8 0 1 1 21 12z"/></svg>
    </button>
  </div>

  <aside id="drawer">
    <header><b>Lyra</b><button id="drawerClose" title="Close chat">&times;</button></header>
    <div id="log"></div>
    <details>
      <summary>Settings &amp; debug</summary>
      <div class="dbgRow">
        <label style="flex:1;gap:6px">Server
          <input id="srvInp" placeholder="http://192.168.1.101:8686" dir="ltr"
            style="flex:1;background:rgba(10,7,20,.6);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:4px 8px;font-size:12px;min-width:0">
        </label>
        <button id="srvSave">Save</button>
      </div>
      <div class="dbgRow">
        <label>Mic <select id="micLang"><option value="en-US">English</option><option value="he-IL">Hebrew</option></select></label>
        <label><input type="checkbox" id="bargeChk" checked> auto barge-in</label>
        <label><input type="checkbox" id="fillerChk" checked> think sounds</label>
        <label><input type="checkbox" id="sceneSndChk"> scene sound</label>
      </div>
      <div class="dbgRow" id="exprRow">
        <button data-emo="neutral">neutral</button><button data-emo="happy">happy</button>
        <button data-emo="excited">excited</button><button data-emo="flirty">flirty</button>
        <button data-emo="surprised">surprised</button><button data-emo="sad">sad</button>
        <button data-ges="nod">nod</button><button data-ges="tilt">tilt</button>
        <button data-ges="wink">wink</button><button data-ges="bounce">bounce</button><button data-ges="wave">wave</button>
        <button data-ges="no">no</button><button data-ges="cocky">cocky</button><button data-ges="sigh">sigh</button>
        <button data-ges="dance">dance</button><button data-ges="jump">jump</button>
      </div>
      <div class="dbgRow">
        <span style="letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;align-self:center">affect</span>
        <button data-aff="neutral">neutral</button><button data-aff="teasing">teasing</button>
        <button data-aff="focused">focused</button><button data-aff="devoted">devoted</button>
        <button data-aff="fierce">fierce</button>
      </div>
    </details>
  </aside>

  <div id="loading"><div class="name">Lyra</div><div id="loadMsg">Waking her up...</div></div>
  <div id="toast"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
